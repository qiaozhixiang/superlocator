name: ios-ipa

# 在 GitHub 的 macOS runner 上编译出 .ipa，产物在 Actions → 本次运行 → Artifacts 里下载。
# 用法：把本文件放到仓库根目录的 .github/workflows/ 下，push 一次或手动 Run workflow。
#
# 只出「未签名 ipa」：不需要配置任何 secrets，下载后用 Sideloadly / AltStore 重签即可装。
# 要出「已签名 ipa」：再配 4 个 secrets（BUILD_CERT_P12_BASE64、BUILD_CERT_PASSWORD、
# PROVISIONING_PROFILE_BASE64、TEAM_ID），并在导出时指定 MobileProvision 里的名称。

on:
  push:
    paths:
      - "work/ios/**"
      - ".github/workflows/ios-ipa.yml"
  workflow_dispatch:

permissions:
  contents: write      # 发布 Release 需要写权限

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      SCHEME: SuperLocator
      BUNDLE_ID: com.stv.locator
      PROJECT_DIR: work/ios/SuperLocator

    steps:
      - uses: actions/checkout@v4

      - name: 环境
        run: |
          xcodebuild -version
          xcode-select -p
          brew install xcodegen
          python3 --version

      - name: 生成工程
        run: |
          cd "$PROJECT_DIR"
          xcodegen generate --spec project.yml
          ls -la

      # ---------- 单元测试（编译 + 逻辑自证，先跑这一步，失败就不出包）----------
      - name: 单元测试（模拟器）
        id: unit
        continue-on-error: true
        run: |
          set -uo pipefail
          cd "$PROJECT_DIR"
          echo "== 可用模拟器 ==" | tee "$RUNNER_TEMP/test.log"
          xcrun simctl list devices available | grep -E "iPhone" | head -12 | tee -a "$RUNNER_TEMP/test.log" || true
          DEST="platform=iOS Simulator,name=iPhone 16"
          if ! xcrun simctl list devices available | grep -q "iPhone 16"; then
            ALT=$(xcrun simctl list devices available | grep -oE "iPhone [0-9A-Za-z ]+" | head -1 | sed 's/ *$//')
            [ -n "${ALT:-}" ] && DEST="platform=iOS Simulator,name=$ALT"
          fi
          echo "== destination: $DEST ==" | tee -a "$RUNNER_TEMP/test.log"
          xcodebuild test             -project SuperLocator.xcodeproj             -scheme "$SCHEME"             -destination "$DEST"             -derivedDataPath "$RUNNER_TEMP/dd-test"             CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO             2>&1 | tee -a "$RUNNER_TEMP/test.log" | tail -80
          rc=${PIPESTATUS[0]}
          echo "---- 测试结果 (xcodebuild rc=$rc) ----" | tee -a "$RUNNER_TEMP/test.log"
          grep -E "error:|Test Suite .* (passed|failed)|Executed [0-9]+ test" "$RUNNER_TEMP/test.log" | tail -40 || true
          exit $rc

      - name: 上传测试日志（失败也能取）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-log
          path: ${{ runner.temp }}/test.log
          if-no-files-found: warn

      - name: 回传测试日志到 ci-log 分支（免 token 也能读）
        if: always()
        run: |
          set -uo pipefail
          mkdir -p ci-logs
          { echo "# unit test log ($GITHUB_SHA)"; grep -E "error:|warning: |Test Suite .* (passed|failed)|Executed [0-9]+ test|destination:" "$RUNNER_TEMP/test.log" | tail -300; } > ci-logs/test.log || true
          git config user.name "SuperLocator Bot"
          git config user.email "qiaozhixiang@users.noreply.github.com"
          git add ci-logs/test.log
          git commit -m "ci: 回传测试日志 [skip ci]" >/dev/null 2>&1 || true
          git push origin HEAD:refs/heads/ci-log >/dev/null 2>&1 || true

      - name: 测试没通过就标记（暂不拦构建，先拿 ipa 与日志）
        continue-on-error: true
        if: steps.unit.outcome != 'success'
        run: |
          echo "::warning::单元测试未通过，见 ci-log 分支 ci-logs/test.log"

      # ---------- 可选：导入签名证书 ----------
      - name: 导入 P12 证书
        if: env.P12_BASE64 != ''
        env:
          P12_BASE64: ${{ secrets.BUILD_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.BUILD_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          security list-keychains -d user -s build.keychain

      - name: 导入 Provisioning Profile
        if: env.PROFILE_BASE64 != ''
        env:
          PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/superlocator.mobileprovision

      # ---------- 构建 ----------
      - name: 无签名构建
        id: build
        continue-on-error: true
        if: env.P12_BASE64 == ''
        env:
          P12_BASE64: ${{ secrets.BUILD_CERT_P12_BASE64 }}
        run: |
          set -uo pipefail
          cd "$PROJECT_DIR"
          xcodebuild -project SuperLocator.xcodeproj -scheme "$SCHEME" -configuration Release             -destination 'generic/platform=iOS'             -derivedDataPath "$RUNNER_TEMP/dd"             CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""             PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID"             build 2>&1 | tee "$RUNNER_TEMP/build.log" | tail -60
          rc=${PIPESTATUS[0]}
          echo "xcodebuild rc=$rc"
          if [ "$rc" -ne 0 ]; then
            echo "---- 编译错误 ----"
            grep -E "error:" "$RUNNER_TEMP/build.log" | tail -60 || true
            exit 1
          fi

      - name: 回传构建日志到 ci-log 分支
        if: always()
        run: |
          set -uo pipefail
          [ -f "$RUNNER_TEMP/build.log" ] || exit 0
          mkdir -p ci-logs
          { echo "# build log ($GITHUB_SHA)"; grep -E "error:|warning: |BUILD (FAILED|SUCCEEDED)|xcodebuild rc=" "$RUNNER_TEMP/build.log" | tail -400; } > ci-logs/build.log
          git config user.name "SuperLocator Bot"
          git config user.email "qiaozhixiang@users.noreply.github.com"
          git add ci-logs/build.log
          git commit -m "ci: 回传构建日志 [skip ci]" >/dev/null 2>&1 || true
          git push origin HEAD:refs/heads/ci-log >/dev/null 2>&1 || true

      - name: 构建失败就停
        if: steps.build.outcome != 'success'
        run: |
          echo "构建失败：见 ci-log 分支 ci-logs/build.log 的 error: 行"
          exit 1

      - name: 打 ipa + tipa
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 ../tools/make_ipa.py             --app "$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/SuperLocator.app"             --out "$RUNNER_TEMP/SuperLocator-unsigned.ipa"             --tipa --allow-unsigned
      - name: 产物指纹
        run: |
          cd "$RUNNER_TEMP"
          for f in *.ipa *.tipa; do [ -f "$f" ] && shasum -a 256 "$f"; done

      - name: 打包 TrollStore tipa（塞进 DVT 特权 entitlements）
        working-directory: work/ios
        run: |
          python3 tools/make_tipa.py             --ipa "$RUNNER_TEMP/SuperLocator-unsigned.ipa"             --out "$RUNNER_TEMP/SuperLocator.trollstore.tipa"             --entitlements ondevice/entitlements.plist
          shasum -a 256 "$RUNNER_TEMP/SuperLocator.trollstore.tipa"

      - name: 拉取 DDI 并注入 tipa（端上模式必需）
        working-directory: work/ios
        run: |
          set -euo pipefail
          python3 tools/fetch_ddi.py --ios 17.0 --variant personalized
          python3 tools/inject_ddi.py \
            --ipa "$RUNNER_TEMP/SuperLocator.trollstore.tipa" \
            --ddi ondevice/ddi/17.0 --ver 17.0 \
            --out "$RUNNER_TEMP/SuperLocator.trollstore.ddi.tipa"
          mv "$RUNNER_TEMP/SuperLocator.trollstore.ddi.tipa" "$RUNNER_TEMP/SuperLocator.trollstore.tipa"
          shasum -a 256 "$RUNNER_TEMP/SuperLocator.trollstore.tipa"
          unzip -l "$RUNNER_TEMP/SuperLocator.trollstore.tipa" | grep -E "ddi/|SuperLocator.app/$" | head -8

      - name: 签名构建 + 导出 ipa
        if: env.P12_BASE64 != ''
        env:
          P12_BASE64: ${{ secrets.BUILD_CERT_P12_BASE64 }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          PROFILE_NAME: ${{ secrets.PROFILE_NAME }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          xcodebuild -project SuperLocator.xcodeproj -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SuperLocator.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>development</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>destination</key><string>export</string>
            <key>thinning</key><string>&lt;none&gt;</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/SuperLocator.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          cp "$RUNNER_TEMP/export"/*.ipa "$RUNNER_TEMP/SuperLocator-signed.ipa"

      - name: 校验 ipa 结构
        run: |
          set -euo pipefail
          cd work/ios
          for f in "$RUNNER_TEMP"/*.ipa; do
            echo "== $f =="
            python3 tools/make_ipa.py --allow-unsigned --check "$f" || true
          done

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: SuperLocator-ipa
          path: |
            ${{ runner.temp }}/*.ipa
            ${{ runner.temp }}/*.tipa
          if-no-files-found: error
          retention-days: 14

      # ---------- 发布到 Release：公网免登录下载（公开仓库）----------
      - name: 发布 Release（免登录下载）
        if: ${{ hashFiles(format('{0}/*.ipa', runner.temp)) != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          sha=$(shasum -a 256 *.ipa | awk '{print $1}')
          gh release view ipa-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1             || gh release create ipa-latest --repo "$GITHUB_REPOSITORY"                  --title "最新 ipa（自动发布）" --notes "sha256(ipa): $sha"
          gh release upload ipa-latest *.ipa *.tipa --clobber --repo "$GITHUB_REPOSITORY"
          echo "下载地址：https://github.com/$GITHUB_REPOSITORY/releases/tag/ipa-latest"
