name: SuperLocator
options:
  bundleIdPrefix: com.stv.locator
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  SuperLocator:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stv.locator
        PRODUCT_NAME: SuperLocator
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: Build/Info.plist
      properties:
        CFBundleDisplayName: 超级虚拟定位
        CFBundleName: SuperLocator
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundlePackageType: APPL
        LSRequiresIPhoneOS: true
        UIRequiresFullScreen: true
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Automatic
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: 用于把真实坐标作为预设路径的起始参考点，并在录制时对齐轨迹。
        NSLocationAlwaysAndWhenInUseUsageDescription: 需要持续读取定位以录制真实移动轨迹。
        NSLocalNetworkUsageDescription: 用于连接电脑上的 superlocator 伴侣程序，把虚拟坐标写入系统定位。
        NSBonjourServices:
          - _superlocator._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

  SuperLocatorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: SuperLocator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stv.locator.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  SuperLocator:
    build:
      targets:
        SuperLocator: all
        SuperLocatorTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: SuperLocatorTests